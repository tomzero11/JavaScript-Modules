<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import</title>
    <!-- Beda nya disini -->
</head>
<body>
    <script type="module">

        /*
            Import 
        => cara menggunakan kata kunci Import 
            ->  import {namaFunction, namaVariable, NamaClass} from "lokasi.js"
        */ 

        import { sayHello, sayGoodBye } from "./export/import.js";

        sayHello("Mamad");
        sayGoodBye("Mamad");
    </script>
</body>
</html>
